<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Resultados</title>
<desc id="d">Resultados. 1.780 registros sensibles expuestos: fuga detectada, verificada, reportada y mitigada. Divulgación responsable: cada hallazgo se reporta a quien debe corregirlo, sin nombres ni detalles técnicos hasta su corrección.</desc>
<style>.c{animation:up .7s cubic-bezier(.2,.7,.2,1) backwards}.p{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.7,.2,1.3) backwards}.n{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) .3s backwards}.l{stroke-dasharray:56;animation:draw .3s ease-out backwards}.f{animation:fd .6s ease-out backwards}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.3)}}@keyframes grow{from{opacity:0;transform:scale(.85)}}@keyframes draw{from{stroke-dashoffset:56}}@keyframes fd{from{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
