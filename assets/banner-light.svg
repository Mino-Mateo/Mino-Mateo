<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Banner de perfil</title>
<desc id="d">Mateo Miño, investigador OSINT. Escaneo de endpoints, fuzzing, detección de filtraciones y divulgación responsable. Quito, Ecuador. Cofundador y Tech Lead de eCondor Digital.</desc>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C967E8" stop-opacity=".7"/><stop offset=".5" stop-color="#983AD6" stop-opacity=".18"/><stop offset="1" stop-color="#C967E8" stop-opacity=".6"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6B21A8"/><stop offset="1" stop-color="#983AD6"/></linearGradient>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="46"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6B21A8" stroke-opacity=".06" stroke-width="1"/></pattern>
<clipPath id="rc"><circle r="110"/></clipPath>
</defs>
<style>
.in{animation:up .7s cubic-bezier(.2,.7,.2,1) backwards}
.ty{animation:type 1.6s steps(50) 1.1s backwards}
.cur{animation:blink 1s steps(1) 2.7s 6 backwards}
.ep{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out backwards}
.sw{animation:spin 6s linear infinite}
.live{transform-box:fill-box;transform-origin:center;animation:ping 1.4s ease-out 3}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{0%{opacity:0}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="340" fill="#FAF7FC"/>
<rect width="1200" height="340" fill="url(#grid)"/>
<circle cx="1008" cy="186" r="120" fill="#FA93FA" opacity="0.28" filter="url(#blur)"/>
<circle cx="250" cy="120" r="110" fill="#FA93FA" opacity="0.2" filter="url(#blur)"/>
<text class="in" x="56" y="58" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#6B21A8" textLength="742" lengthAdjust="spacingAndGlyphs">OSINT · ENDPOINTS · FILTRACIONES · DIVULGACIÓN RESPONSABLE</text>
<text class="in" style="animation-delay:.15s" x="52" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="800" letter-spacing="-1.5" fill="url(#nm)">Mateo Miño</text>
<text class="in" style="animation-delay:.3s" x="56" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#1A1024">Investigador OSINT</text>
<g class="in" style="animation-delay:.5s">
<rect x="48.5" y="206.5" width="760" height="50" rx="8" fill="rgba(152,58,214,0.04)" stroke="url(#bd)"/>
<text class="ty" x="68" y="239" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#1A1024" textLength="690" lengthAdjust="spacingAndGlyphs"><tspan fill="#6B21A8" font-weight="700">mateo@recon:~$</tspan> scan --endpoints --fuentes-abiertas</text>
<rect class="cur" x="766" y="219" width="13" height="26" rx="1" fill="#6B21A8"/>
</g>
<text class="in" style="animation-delay:.7s" x="56" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#52456A" xml:space="preserve">Quito, Ecuador  |  Cofundador y Tech Lead, eCondor Digital</text>
<g class="in" style="animation-delay:.2s">
<rect x="848.5" y="20.5" width="330" height="299" rx="8" fill="rgba(152,58,214,0.04)" stroke="url(#bd)"/>
<g transform="translate(1008 186)" fill="none" stroke="#983AD6" stroke-width="1.5">
<circle r="110" stroke-opacity=".55"/><circle r="73" stroke-opacity=".35"/><circle r="36" stroke-opacity=".35"/>
<path d="M-110 0H110M0 -110V110" stroke-opacity=".25"/>
