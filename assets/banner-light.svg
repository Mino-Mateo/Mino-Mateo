<circle r="4" fill="#983AD6" stroke="none"/>
<g stroke="none"><g class="ep" style="animation-delay:0.9s"><circle cx="46" cy="-52" r="11" fill="none" stroke="#983AD6" stroke-opacity=".45" stroke-width="2"/><circle cx="46" cy="-52" r="5" fill="#983AD6"/></g><g class="ep" style="animation-delay:1.5s"><circle cx="-66" cy="-28" r="11" fill="none" stroke="#983AD6" stroke-opacity=".45" stroke-width="2"/><circle cx="-66" cy="-28" r="5" fill="#983AD6"/></g><g class="ep" style="animation-delay:2.1s"><circle cx="34" cy="58" r="11" fill="none" stroke="#983AD6" stroke-opacity=".45" stroke-width="2"/><circle cx="34" cy="58" r="5" fill="#983AD6"/></g><g class="ep" style="animation-delay:2.7s"><circle cx="-38" cy="70" r="11" fill="none" stroke="#983AD6" stroke-opacity=".45" stroke-width="2"/><circle cx="-38" cy="70" r="5" fill="#983AD6"/></g></g>
</g>
<rect x="864.5" y="34.5" width="180" height="36" rx="18" fill="rgba(152,58,214,0.04)" stroke="url(#bd)"/>
<circle class="live" cx="884" cy="52.5" r="5" fill="none" stroke="#6B21A8" stroke-width="2"/>
<circle cx="884" cy="52.5" r="5" fill="#6B21A8"/>
<text x="898" y="60" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#6B21A8" textLength="130" lengthAdjust="spacingAndGlyphs">EN ACTIVO</text>
